name: morss
description: Morss reader with local reading storage and the selected A interface.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.0
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  file_picker: ^12.3.0
  html: ^0.15.7
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/reader_demo.json
    - assets/images/
    - assets/icons/
  fonts:
    - family: MorssSans
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: MorssSerif
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
